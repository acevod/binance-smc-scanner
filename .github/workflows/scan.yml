name: Binance SMC Scan

on:
  workflow_dispatch: {}          # manual "Run workflow" button on GitHub
  repository_dispatch:
    types: [telegram-scan]       # triggered remotely by the Cloudflare Worker

jobs:
  scan:
    # Runs on YOUR own machine (phone via Termux/proot-distro, or a PC),
    # not GitHub's servers - Binance blocks GitHub's own datacenter IPs.
    # See README.md "Self-hosted runner" section for setup.
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # No actions/setup-python here on purpose: on a self-hosted runner
      # we just use whatever python3 is already installed on the machine
      # (see README - installed via apt inside the proot-distro Ubuntu).
      - name: Install dependencies
        run: pip3 install -r requirements.txt

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TIMEFRAME: "30m"
          GENERATE_CHARTS: "true"
        run: python3 scan_binance.py
